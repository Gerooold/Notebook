<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Notebook</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.383.0/umd/lucide.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

  :root {
    --green:       #4A7C59;
    --green-dark:  #3A6347;
    --green-light: #E8F0EB;
    --text-dark:   #1C2B22;
    --text-mid:    #5A6B61;
    --text-light:  #9AABA1;
    --border:      #E5EBE7;
    --bg:          #FFFFFF;
    --bg-section:  #F7F9F7;
    --red:         #D95C5C;
    --red-light:   #FDEAEA;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text-dark);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ══ LOGIN ══ */
  #login-screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
  }

  .app-icon {
    width: 80px; height: 80px;
    background: linear-gradient(145deg, #5A8F6A, #3A6347);
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1.5rem;
    box-shadow: 0 4px 16px rgba(74,124,89,0.3);
    color: white;
  }

  .login-title { font-size: 1.7rem; font-weight: 700; text-align: center; margin-bottom: 0.3rem; }
  .login-sub   { font-size: 0.88rem; color: var(--text-light); text-align: center; margin-bottom: 2.5rem; }

  .pin-display { display: flex; justify-content: center; gap: 16px; margin-bottom: 2rem; }
  .pin-dot {
    width: 13px; height: 13px; border-radius: 50%;
    border: 2px solid var(--green); background: transparent;
    transition: background 0.15s;
  }
  .pin-dot.filled { background: var(--green); }

  .pin-pad {
    display: grid; grid-template-columns: repeat(3,1fr);
    gap: 12px; width: 100%; max-width: 280px; margin: 0 auto;
  }
  .pin-btn {
    background: var(--bg-section); border: 1px solid var(--border);
    border-radius: 16px; padding: 1.1rem;
    font-size: 1.4rem; font-family: 'Inter',sans-serif; font-weight: 600;
    color: var(--text-dark); cursor: pointer; user-select: none;
    transition: background 0.12s;
    display: flex; align-items: center; justify-content: center;
  }
  .pin-btn:active { background: var(--green-light); }
  .pin-btn.delete { font-size: 1rem; color: var(--text-mid); }
  .pin-btn.empty  { visibility: hidden; }
  .login-error { color: var(--red); font-size: 0.82rem; text-align: center; margin-top: 1rem; font-weight: 500; min-height: 1.2em; }

  /* ══ APP ══ */
  #app { display: none; flex-direction: column; min-height: 100vh; }
  #app.visible { display: flex; }

  .app-header {
    padding: 1rem 1.2rem 0.7rem;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    background: var(--bg); position: sticky; top: 0; z-index: 100;
  }
  .header-left h1 { font-size: 1.2rem; font-weight: 700; }
  .header-left span { font-size: 0.75rem; color: var(--text-light); }

  .icon-btn {
    width: 36px; height: 36px;
    background: var(--bg-section); border: 1px solid var(--border);
    border-radius: 10px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text-mid);
  }
  .icon-btn:active { background: var(--green-light); }

  /* ── Tab Bar ── */
  .tab-bar {
    display: flex; background: var(--bg);
    border-top: 1px solid var(--border);
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .tab-item {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    padding: 0.6rem 0.4rem 0.5rem; gap: 3px;
    cursor: pointer; border: none; background: none;
    color: var(--text-light); font-family: 'Inter',sans-serif;
    font-size: 0.68rem; font-weight: 500; transition: color 0.15s;
  }
  .tab-item.active { color: var(--green); }

  /* ── Content ── */
  .tab-content { display: none; flex: 1; padding: 1.2rem 1.2rem 5.5rem; }
  .tab-content.active { display: block; }

  .section-header {
    font-size: 0.72rem; font-weight: 600; color: var(--text-light);
    text-transform: uppercase; letter-spacing: 0.06em;
    margin: 1.4rem 0 0.5rem;
  }
  .section-header:first-child { margin-top: 0; }

  .list-card { background: var(--bg); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; margin-bottom: 0.3rem; }

  /* ── Form ── */
  .form-label { font-size: 0.75rem; font-weight: 600; color: var(--text-mid); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.4rem; display: block; }
  .form-input, .form-textarea {
    width: 100%; background: var(--bg-section); border: 1px solid var(--border);
    border-radius: 12px; padding: 0.8rem 1rem;
    font-family: 'Inter',sans-serif; font-size: 0.92rem; color: var(--text-dark);
    outline: none; -webkit-appearance: none; transition: border-color 0.15s;
  }
  .form-input:focus, .form-textarea:focus { border-color: var(--green); }
  .form-textarea { min-height: 150px; resize: vertical; line-height: 1.6; }
  .form-group { margin-bottom: 1rem; }

  .btn-green {
    width: 100%; background: var(--green); color: white; border: none;
    border-radius: 14px; padding: 1rem;
    font-family: 'Inter',sans-serif; font-size: 0.95rem; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    transition: background 0.15s;
  }
  .btn-green:active { background: var(--green-dark); }

  .save-feedback { text-align: center; color: var(--green); font-size: 0.82rem; font-weight: 600; margin-top: 0.6rem; min-height: 1.1em; opacity: 0; transition: opacity 0.25s; }
  .save-feedback.show { opacity: 1; }

  /* ── Log toolbar ── */
  .log-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; gap: 0.5rem; }
  .count-badge { font-size: 0.78rem; font-weight: 600; color: var(--text-light); white-space: nowrap; }

  .toolbar-btns { display: flex; gap: 0.4rem; }

  .btn-sm {
    background: var(--green-light); color: var(--green-dark);
    border: none; border-radius: 10px; padding: 0.45rem 0.8rem;
    font-family: 'Inter',sans-serif; font-size: 0.78rem; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; gap: 0.3rem;
    white-space: nowrap;
  }
  .btn-sm:active { background: #c8dfd0; }
  .btn-sm.danger { background: var(--red-light); color: var(--red); }
  .btn-sm.danger:active { background: #f5c6c6; }

  /* ── Entry Cards ── */
  .entry-card {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 14px; padding: 1rem 1.1rem; margin-bottom: 0.7rem;
    border-left: 3px solid var(--green);
    animation: slideIn 0.22s ease;
  }
  @keyframes slideIn { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }

  .entry-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
  .entry-date { font-size: 0.74rem; font-weight: 600; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.04em; }

  .entry-actions { display: flex; gap: 0.3rem; }
  .entry-action-btn {
    width: 30px; height: 30px; border: none; background: none;
    border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: var(--text-light);
  }
  .entry-action-btn:active { background: var(--red-light); color: var(--red); }

  .entry-body { font-size: 0.88rem; color: var(--text-dark); line-height: 1.6; white-space: pre-wrap; }

  /* confirm delete overlay */
  .delete-confirm {
    display: none; margin-top: 0.7rem; padding: 0.7rem;
    background: var(--red-light); border-radius: 10px;
    align-items: center; justify-content: space-between; gap: 0.5rem;
  }
  .delete-confirm.show { display: flex; }
  .delete-confirm span { font-size: 0.8rem; color: var(--red); font-weight: 500; }
  .del-yes { background: var(--red); color: white; border: none; border-radius: 8px; padding: 0.35rem 0.8rem; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
  .del-no  { background: none; color: var(--text-mid); border: 1px solid var(--border); border-radius: 8px; padding: 0.35rem 0.8rem; font-size: 0.8rem; cursor: pointer; }

  .empty-state { text-align: center; padding: 3.5rem 1rem; color: var(--text-light); }
  .empty-icon { display: flex; justify-content: center; margin-bottom: 0.8rem; }
  .empty-state p { font-size: 0.88rem; line-height: 1.6; }

  /* hidden import input */
  #csv-import-input { display: none; }
</style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="login-screen">
  <div class="app-icon">
    <i data-lucide="book-open" style="width:36px;height:36px;"></i>
  </div>
  <div class="login-title">Notebook</div>
  <div class="login-sub">Privat &amp; gesichert</div>
  <div class="pin-display">
    <div class="pin-dot" id="d0"></div>
    <div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div>
    <div class="pin-dot" id="d3"></div>
  </div>
  <div class="pin-pad">
    <button class="pin-btn" onclick="pinPress('1')">1</button>
    <button class="pin-btn" onclick="pinPress('2')">2</button>
    <button class="pin-btn" onclick="pinPress('3')">3</button>
    <button class="pin-btn" onclick="pinPress('4')">4</button>
    <button class="pin-btn" onclick="pinPress('5')">5</button>
    <button class="pin-btn" onclick="pinPress('6')">6</button>
    <button class="pin-btn" onclick="pinPress('7')">7</button>
    <button class="pin-btn" onclick="pinPress('8')">8</button>
    <button class="pin-btn" onclick="pinPress('9')">9</button>
    <button class="pin-btn empty"></button>
    <button class="pin-btn" onclick="pinPress('0')">0</button>
    <button class="pin-btn delete" onclick="pinDelete()">
      <i data-lucide="delete" style="width:20px;height:20px;"></i>
    </button>
  </div>
  <div class="login-error" id="login-error"></div>
</div>

<!-- ══ APP ══ -->
<div id="app">
  <div class="app-header">
    <div class="header-left">
      <h1>Notebook</h1>
      <span>Angemeldet als: Gerold</span>
    </div>
    <div class="icon-btn" onclick="logout()">
      <i data-lucide="lock" style="width:18px;height:18px;"></i>
    </div>
  </div>

  <!-- TAB: ERFASSUNG -->
  <div class="tab-content active" id="tab-erfassung">
    <div class="section-header">Zeitpunkt</div>
    <div class="list-card" style="padding:1rem;">
      <div class="form-group">
        <label class="form-label">Datum &amp; Uhrzeit</label>
        <input type="datetime-local" class="form-input" id="entry-datetime">
      </div>
    </div>

    <div class="section-header">Notiz</div>
    <div class="list-card" style="padding:1rem;">
      <div class="form-group">
        <label class="form-label">Was ist passiert?</label>
        <textarea class="form-textarea" id="entry-text"
          placeholder="Beschreibe die Situation genau – was wurde gesagt (wörtlich), wer war dabei, wie war das Verhalten..."></textarea>
      </div>
      <button class="btn-green" onclick="saveEntry()">
        <i data-lucide="save" style="width:17px;height:17px;"></i>
        Eintrag speichern
      </button>
      <div class="save-feedback" id="save-feedback">Gespeichert ✓</div>
    </div>
  </div>

  <!-- TAB: VERLAUF -->
  <div class="tab-content" id="tab-verlauf">
    <div class="log-toolbar">
      <span class="count-badge" id="entry-count">0 Einträge</span>
      <div class="toolbar-btns">
        <button class="btn-sm" onclick="exportCSV()">
          <i data-lucide="download" style="width:14px;height:14px;"></i> Export
        </button>
        <button class="btn-sm" onclick="triggerImport()">
          <i data-lucide="upload" style="width:14px;height:14px;"></i> Import
        </button>
        <button class="btn-sm danger" onclick="deleteAll()">
          <i data-lucide="trash-2" style="width:14px;height:14px;"></i> Alle
        </button>
      </div>
    </div>
    <input type="file" id="csv-import-input" accept=".csv" onchange="importCSV(event)">
    <div id="entries-list"></div>
  </div>

  <!-- BOTTOM TAB BAR -->
  <div class="tab-bar">
    <button class="tab-item active" id="tbtn-erfassung" onclick="switchTab('erfassung')">
      <i data-lucide="pen-line" style="width:22px;height:22px;"></i>
      Erfassung
    </button>
    <button class="tab-item" id="tbtn-verlauf" onclick="switchTab('verlauf')">
      <i data-lucide="list-checks" style="width:22px;height:22px;"></i>
      Verlauf
    </button>
  </div>
</div>

<script>
const CORRECT_PIN = '4864';
let pinBuffer = '';
let entries = [];

// ── Storage ──
function save() {
  try { localStorage.setItem('tb_v3', JSON.stringify(entries)); } catch(e) {}
}
function load() {
  try { const d = localStorage.getItem('tb_v3'); if (d) entries = JSON.parse(d); }
  catch(e) { entries = []; }
}

// ── Helpers ──
function nowLocal() {
  const n = new Date(), p = x => String(x).padStart(2,'0');
  return `${n.getFullYear()}-${p(n.getMonth()+1)}-${p(n.getDate())}T${p(n.getHours())}:${p(n.getMinutes())}`;
}
function fmtDate(s) {
  if (!s) return '–';
  return new Date(s).toLocaleString('de-DE', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
// normalize datetime string for comparison (strip seconds, use T separator)
function normDt(s) {
  if (!s) return '';
  return s.trim().replace(' ','T').slice(0,16);
}

// ── PIN ──
function pinPress(d) {
  if (pinBuffer.length >= 4) return;
  pinBuffer += d; updateDots();
  if (pinBuffer.length === 4) setTimeout(checkPin, 180);
}
function pinDelete() { pinBuffer = pinBuffer.slice(0,-1); updateDots(); }
function updateDots() {
  for (let i=0;i<4;i++)
    document.getElementById('d'+i).classList.toggle('filled', i < pinBuffer.length);
}
function checkPin() {
  if (pinBuffer === CORRECT_PIN) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').classList.add('visible');
    load(); setNow(); renderEntries();
    document.getElementById('login-error').textContent = '';
  } else {
    document.getElementById('login-error').textContent = 'Falscher PIN – bitte erneut versuchen.';
    pinBuffer = ''; updateDots();
  }
}
function logout() {
  pinBuffer = ''; updateDots();
  document.getElementById('app').classList.remove('visible');
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-error').textContent = '';
}

// ── Tabs ──
function switchTab(name) {
  ['erfassung','verlauf'].forEach(t => {
    document.getElementById('tab-'+t).classList.toggle('active', t===name);
    document.getElementById('tbtn-'+t).classList.toggle('active', t===name);
  });
  if (name==='verlauf') renderEntries();
  if (name==='erfassung') setNow();
}
function setNow() { document.getElementById('entry-datetime').value = nowLocal(); }

// ── Save ──
function saveEntry() {
  const dt   = document.getElementById('entry-datetime').value;
  const text = document.getElementById('entry-text').value.trim();
  if (!text) { alert('Bitte eine Notiz eingeben.'); return; }
  entries.unshift({ id: Date.now(), dt: dt || nowLocal(), text });
  save();
  document.getElementById('entry-text').value = '';
  setNow();
  const fb = document.getElementById('save-feedback');
  fb.classList.add('show');
  setTimeout(() => fb.classList.remove('show'), 2000);
}

// ── Render ──
function renderEntries() {
  const list = document.getElementById('entries-list');
  const cnt  = document.getElementById('entry-count');
  cnt.textContent = entries.length + (entries.length===1 ? ' Eintrag' : ' Einträge');
  if (!entries.length) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon"><i data-lucide="notebook-pen" style="width:40px;height:40px;"></i></div><p>Noch keine Einträge.<br>Wechsle zu „Erfassung" um zu beginnen.</p></div>`;
    lucide.createIcons();
    return;
  }
  list.innerHTML = entries.map(e => `
    <div class="entry-card" id="ec-${e.id}">
      <div class="entry-meta">
        <span class="entry-date" style="display:flex;align-items:center;gap:5px;"><i data-lucide="calendar" style="width:13px;height:13px;"></i>${fmtDate(e.dt)}</span>
        <div class="entry-actions">
          <button class="entry-action-btn" onclick="toggleConfirm(${e.id})" title="Löschen">
            <i data-lucide="trash-2" style="width:16px;height:16px;"></i>
          </button>
        </div>
      </div>
      <div class="entry-body">${esc(e.text)}</div>
      <div class="delete-confirm" id="dc-${e.id}">
        <span>Eintrag löschen?</span>
        <div style="display:flex;gap:0.4rem;">
          <button class="del-no"  onclick="toggleConfirm(${e.id})">Abbrechen</button>
          <button class="del-yes" onclick="delEntry(${e.id})">Löschen</button>
        </div>
      </div>
    </div>`).join('');
  lucide.createIcons();
}

function toggleConfirm(id) {
  const el = document.getElementById('dc-'+id);
  if (el) el.classList.toggle('show');
}

function delEntry(id) {
  entries = entries.filter(e => e.id !== id);
  save(); renderEntries();
}

function deleteAll() {
  if (!entries.length) return;
  if (!confirm(`Alle ${entries.length} Einträge unwiderruflich löschen?`)) return;
  entries = []; save(); renderEntries();
}

// ── CSV Export ──
function escapeCsv(s) {
  return '"' + String(s).replace(/"/g, '""') + '"';
}

function exportCSV() {
  if (!entries.length) { alert('Keine Einträge vorhanden.'); return; }
  const rows = ['Datum,Uhrzeit,Notiz'];
  entries.forEach(e => {
    const d = new Date(e.dt);
    const datum = d.toLocaleDateString('de-DE', {day:'2-digit',month:'2-digit',year:'numeric'});
    const zeit  = d.toLocaleTimeString('de-DE', {hour:'2-digit',minute:'2-digit'});
    rows.push([escapeCsv(datum), escapeCsv(zeit), escapeCsv(e.text)].join(','));
  });
  const bom  = '\uFEFF'; // UTF-8 BOM for Excel compatibility
  const blob = new Blob([bom + rows.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = 'Notebook_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

// ── CSV Import ──
function triggerImport() {
  document.getElementById('csv-import-input').value = '';
  document.getElementById('csv-import-input').click();
}

function importCSV(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result.replace(/^\uFEFF/, ''); // strip BOM
    const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    if (lines.length < 2) { alert('Keine gültigen Einträge gefunden.'); return; }

    // build set of existing timestamps for dedup check (YYYY-MM-DDTHH:MM)
    const existing = new Set(entries.map(e => normDt(e.dt)));

    let added = 0, skipped = 0;
    const newEntries = [];

    for (let i = 1; i < lines.length; i++) {
      const cols = parseCsvLine(lines[i]);
      if (cols.length < 3) { skipped++; continue; }

      const [datum, zeit, ...rest] = cols;
      const notiz = rest.join(','); // in case text contained commas

      // parse de date DD.MM.YYYY HH:MM → ISO
      let dtStr = '';
      try {
        const [day,month,year] = datum.split('.');
        dtStr = `${year}-${month.padStart(2,'0')}-${day.padStart(2,'0')}T${zeit.padStart(5,'0')}`;
      } catch(err) { skipped++; continue; }

      const key = normDt(dtStr);
      if (existing.has(key)) { skipped++; continue; }

      existing.add(key);
      newEntries.push({ id: Date.now() + i, dt: dtStr, text: notiz });
      added++;
    }

    // merge: new entries appended, existing stay; sort by date desc
    entries = [...entries, ...newEntries].sort((a,b) => new Date(b.dt) - new Date(a.dt));
    save();
    renderEntries();
    alert(`Import abgeschlossen:\n✓ ${added} neu hinzugefügt\n– ${skipped} übersprungen (bereits vorhanden oder ungültig)`);
  };
  reader.readAsText(file, 'UTF-8');
}

// Simple CSV line parser (handles quoted fields with escaped quotes)
function parseCsvLine(line) {
  const result = [];
  let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') {
      if (inQ && line[i+1] === '"') { cur += '"'; i++; }
      else { inQ = !inQ; }
    } else if (c === ',' && !inQ) {
      result.push(cur); cur = '';
    } else {
      cur += c;
    }
  }
  result.push(cur);
  return result;
}

// ── Init ──
window.addEventListener('DOMContentLoaded', () => { lucide.createIcons(); });
</script>
</body>
</html>
